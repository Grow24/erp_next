<!doctype html>
<html lang="en">

    <style>
      body {

      p {
        margin: 0.25rem 0;
        color: #4b5563;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.6rem;

        font-size: 0.75rem;
        background: #eef2ff;
        color: #3730a3;

        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
